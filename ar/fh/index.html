<style>
  #a1a-arc-widget, #a1a-arc-widget * {
    box-sizing: border-box !important;
    font-family: Verdana, Tahoma, sans-serif !important;
  }

  #a1a-arc-widget {
    position: fixed !important;

  #a1a-arc-toggle {

  #a1a-arc-panel {

  #a1a-arc-panel.open { display: block !important; }

<script>
  (function() {
    var toggle = document.getElementById('a1a-arc-toggle');
    var panel = document.getElementById('a1a-arc-panel');
    toggle.addEventListener('click', function() {
      var isOpen = panel.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
    });
    document.addEventListener('click', function(e) {
      if (!document.getElementById('a1a-arc-widget').contains(e.target)) {
        panel.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>
