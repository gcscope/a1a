<script>
  document.documentElement.classList.add('no-transition');

  const btn = document.getElementById('themeToggle');
  const html = document.documentElement;

  function setTheme(theme) {
    html.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    btn.textContent = theme === 'dark' ? 'light mode' : 'dark mode';
  }

  setTheme(localStorage.getItem('theme') || 'light');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.documentElement.classList.remove('no-transition');
    });
  });

  btn.addEventListener('click', () => {
    setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
</script>
<script type="module">
  // Admin detection: if the signed-in Firebase user (same session as the
  // comment wall) is the site owner, show the create-blog button. Firebase is
  // only used for login here — publishing itself goes through GitHub, which
  // is the real access control.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { firebaseConfig, ADMIN_UID } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  await setPersistence(auth, browserLocalPersistence);

  const loginBox = document.getElementById('admin-login');

  onAuthStateChanged(auth, (user) => {
    if (user && user.uid === ADMIN_UID && !document.getElementById('createBlog')) {
      loginBox.style.display = 'none';
      const create = document.createElement('button');
      create.className = 'links';
      create.id = 'createBlog';
      create.textContent = 'create blog';
      create.style.marginTop = '8px';
      create.addEventListener('click', () => location.href = 'blogs/editor.html');
      document.querySelector('.stuff').prepend(create);
    }
  });

  // Unobtrusive fallback login for a fresh browser (normally the wall's
  // session on os/cs is picked up automatically, since it's the same origin).
  document.getElementById('admin-dot').addEventListener('click', () => {
    loginBox.style.display = loginBox.style.display === 'flex' ? 'none' : 'flex';
  });
  document.getElementById('admin-signin').addEventListener('click', async () => {
    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById('admin-email').value.trim(),
        document.getElementById('admin-pass').value
      );
    } catch (err) {
      console.error('sign-in failed', err);
    }
  });
</script>
